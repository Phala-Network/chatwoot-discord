name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Same-repo changes use the organization's runner when the CI_RUNNER variable names one;
    # pull requests from forks always run on GitHub-hosted runners.
    runs-on: ${{ (github.event.pull_request.head.repo.fork && 'ubuntu-24.04') || vars.CI_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 15
    env:
      CF_SEND_TELEMETRY: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      # Node 24 ships npm 11; use the npm version pinned in `packageManager` (npm 12 runs
      # dependency install scripts only for packages listed in `allowScripts`).
      - run: npm install --global "$(node -p 'require("./package.json").packageManager')"
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Scripts load under Node type stripping
        # With no arguments a script prints its usage and exits 2.
        run: |
          node scripts/register-commands.ts || [ $? -eq 2 ]
          node scripts/forum-tags.ts || [ $? -eq 2 ]
      - name: Build, and check the deploy (dry run)
        run: |
          npm run build
          npx cf deploy --prebuilt --dry-run
      - name: Package (what npm publish would ship), installed and type-checked by a consumer
        # The command prints its usage and exits 2 without arguments.
        run: |
          # npm publish rewrites what `npm pkg fix` fixes, with only a warning: package.json must need no fix.
          npm pkg fix
          git diff --exit-code package.json
          npm pack --pack-destination test/package
          cd test/package
          npm install --no-save --no-audit --no-fund ./chatwoot-discord-relay-*.tgz typescript @cloudflare/workers-types @types/node@24
          npx tsc -p tsconfig.json
          npx tsc -p tsconfig.worker.json
          npx chatwoot-discord-store-config || [ $? -eq 2 ]

