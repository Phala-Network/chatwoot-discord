name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Same-repo changes use the organization's runner when the CI_RUNNER variable names one;
    # pull requests from forks always run on GitHub-hosted runners.
    runs-on: ${{ (github.event.pull_request.head.repo.fork && 'ubuntu-24.04') || vars.CI_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 15
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Bun installs dependencies and runs the scripts; the version comes from `packageManager`
      # in package.json (https://github.com/oven-sh/setup-bun#usage).
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      # Vitest and wrangler are Node CLIs (`#!/usr/bin/env node`), which `bun run` executes with
      # Node (https://bun.com/docs/runtime).
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test
      - name: Build (wrangler dry run, no deploy)
        run: bun run build
