name: Release

# Publishes the package to npm when a GitHub release is published, with npm trusted publishing
# (https://docs.npmjs.com/trusted-publishers): the workflow proves its identity with OIDC, so no
# npm token is stored, and npm attaches provenance to the published version.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    # Releases only: a prerelease would need its own npm dist-tag.
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    env:
      CF_SEND_TELEMETRY: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          # No cache in a job that can publish.
          package-manager-cache: false
      # Trusted publishing needs npm 11.5.1 or later; use the version pinned in `packageManager`.
      - run: npm install --global "$(node -p 'require("./package.json").packageManager')"
      - name: The release tag names the package version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: test "$TAG" = "v$(node -p 'require("./package.json").version')"
      - run: npm ci
      - run: npm test
      # Builds the package (prepack) and publishes it.
      - run: npm publish
