name: Bug report
description: Something does not work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not include tokens, webhook secrets, customer data, or message contents. For security
        issues, use the security policy instead of this form.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: The release or commit of chatwoot-discord-relay you run.
    validations:
      required: true
  - type: input
    id: chatwoot-version
    attributes:
      label: Chatwoot version
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant log lines
      description: Workers Logs entries (they contain ids and outcomes only). Remove anything sensitive.
      render: json
