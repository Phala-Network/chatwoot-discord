version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Wait before proposing a newly published version. Cooldown applies to version updates
    # (https://docs.github.com/en/code-security/dependabot/working-with-dependabot/dependabot-options-reference#cooldown-).
    cooldown:
      default-days: 3
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
    # Majors held on purpose (https://docs.github.com/en/code-security/dependabot/working-with-dependabot/dependabot-options-reference#ignore--):
    ignore:
      # Types follow the Node runtime, which is Node 24 (Active LTS).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # @cloudflare/vitest-pool-workers requires vitest ^4.1; remove once it supports vitest 5
      # (https://github.com/cloudflare/workers-sdk/pull/15500).
      - dependency-name: "vitest"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
