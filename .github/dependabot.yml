version: 2
updates:
  # A wrangler update also needs `npm run types` (see CONTRIBUTING.md).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Wait before proposing a newly published version. Cooldown applies to version updates
    # (https://docs.github.com/en/code-security/dependabot/working-with-dependabot/dependabot-options-reference#cooldown-).
    cooldown:
      default-days: 3
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
